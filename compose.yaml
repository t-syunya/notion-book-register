services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      BOOK_REGISTER_HOST: 0.0.0.0
      BOOK_REGISTER_PORT: "8000"
    ports:
      - "${BOOK_REGISTER_BIND_ADDRESS:-127.0.0.1}:${BOOK_REGISTER_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          response = urlopen('http://127.0.0.1:8000/healthz', timeout=3);
          assert response.status == 200
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
