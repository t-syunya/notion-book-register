[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "notion-book-register"
version = "0.1.0"
description = "Register books to Notion from captured book images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = ["defusedxml>=0.7.1"]

[dependency-groups]
dev = ["ruff>=0.16.5,<0.17"]

[tool.uv]
required-version = ">=0.12.7,<0.13"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
